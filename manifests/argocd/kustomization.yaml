apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - install.yaml

patches:
  - patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: argocd-application-controller
        annotations:
          iam.gke.io/gcp-service-account: argocd-cluster-manager@mq-usecase-1.iam.gserviceaccount.com
  - patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: argocd-server
        annotations:
          iam.gke.io/gcp-service-account: argocd-cluster-manager@mq-usecase-1.iam.gserviceaccount.com
  - path: argocd-rbac-cm-patch.yaml
