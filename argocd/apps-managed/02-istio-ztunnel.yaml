apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-ztunnel-managed
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/wilsonfv/istio-ambient-config.git
    targetRevision: HEAD
    path: charts/istio-ztunnel
  destination:
    name: gke-managed-cluster
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
