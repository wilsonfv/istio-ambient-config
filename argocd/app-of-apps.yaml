apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-ambient-root-cp
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/wilsonfv/istio-ambient-config.git
    targetRevision: HEAD
    path: argocd/clusters/argocd-control-plane
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
