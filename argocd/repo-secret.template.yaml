# Argo CD Repository Credentials Secret Template
# This secret allows Argo CD to pull configurations from the private GitHub repository.
#
# Apply using:
#   kubectl apply -f argocd/repo-secret.template.yaml
# Or use the helper script:
#   ./scripts/configure-argocd-repo.sh
apiVersion: v1
kind: Secret
metadata:
  name: repo-istio-ambient-config
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  url: https://github.com/wilsonfv/istio-ambient-config.git
  username: wilsonfv
  password: ${GITHUB_PAT_TOKEN}
