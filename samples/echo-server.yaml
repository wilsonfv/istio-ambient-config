apiVersion: v1
kind: ServiceAccount
metadata:
  name: echo-server
  namespace: apps-ambient
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-server
  namespace: apps-ambient
  labels:
    app: echo-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: echo-server
  template:
    metadata:
      labels:
        app: echo-server
    spec:
      serviceAccountName: echo-server
      containers:
        - name: echo
          image: registry.k8s.io/e2e-test-images/agnhost:2.43
          args: ["netexec", "--http-port=8080"]
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: echo-server
  namespace: apps-ambient
spec:
  ports:
    - port: 80
      targetPort: 8080
      name: http
  selector:
    app: echo-server
