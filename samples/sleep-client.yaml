apiVersion: v1
kind: ServiceAccount
metadata:
  name: sleep-client
  namespace: apps-ambient
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sleep-client
  namespace: apps-ambient
  labels:
    app: sleep-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sleep-client
  template:
    metadata:
      labels:
        app: sleep-client
    spec:
      serviceAccountName: sleep-client
      containers:
        - name: sleep
          image: curlimages/curl:8.6.0
          command: ["/bin/sh", "-c", "while true; do sleep 3600; done"]
