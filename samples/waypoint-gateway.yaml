# Ambient Waypoint Gateway for Layer 7 traffic routing and authorization
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: namespace-waypoint
  namespace: apps-ambient
  labels:
    istio.io/waypoint-for: all
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
