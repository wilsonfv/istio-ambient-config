# Istio CNI Plugin configured specifically for GKE Ambient Mode
cni:
  profile: ambient
  cni:
    ambient:
      enabled: true
      dnsCapture: true
      ipv6: true
      reconcileIptablesOnStartup: true
    # GKE node filesystem paths for CNI binaries and network configuration
    cniBinDir: /home/kubernetes/bin
    cniConfDir: /etc/cni/net.d
    cniNetnsDir: /var/run/netns
    excludeNamespaces:
      - kube-system
      - istio-system
      - gmp-system
      - gke-managed-cim
  global:
    istioNamespace: istio-system
